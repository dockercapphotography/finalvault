<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finalvault_logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>FinalVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // injectRegister: null means we register manually -- and in
          // dev, vite-plugin-pwa serves the injectManifest worker at
          // /dev-sw.js?dev-sw, not /sw.js (that's prod-only). Requires
          // this to be a module script so import.meta.env resolves.
          const swUrl = import.meta.env.MODE === 'production' ? '/sw.js' : '/dev-sw.js?dev-sw'
          navigator.serviceWorker.register(swUrl, { type: import.meta.env.MODE === 'production' ? 'classic' : 'module' }).catch(err => {
            console.warn('Service worker registration failed:', err)
          })
        })
      }
    </script>
  </body>
</html>
