<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/finalvault_logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>FinalVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist is the app-wide font (index.css); Montserrat is the login wordmark. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // injectRegister: null means we register manually -- and in
          // dev, vite-plugin-pwa serves the injectManifest worker at
          // /dev-sw.js?dev-sw, not /sw.js (that's prod-only). Requires
          // this to be a module script so import.meta.env resolves.
          // PROD (not MODE) so the Playwright e2e build registers the real
          // /sw.js too; production and dev are unchanged.
          const swUrl = import.meta.env.PROD ? '/sw.js' : '/dev-sw.js?dev-sw'
          navigator.serviceWorker.register(swUrl, { type: import.meta.env.PROD ? 'classic' : 'module' })
            .then(registration => {
              // Without this, the browser only naturally re-checks for
              // a new worker on a full page navigation or its own
              // internal ~24h heuristic -- a tab left open for a long
              // session can keep serving a stale build for hours after
              // a real deploy. registerType: 'autoUpdate' means a
              // newly-installed worker skips waiting and activates on
              // its own once found; this just makes sure "found"
              // actually happens promptly while the tab stays open.
              //
              // update() rejects whenever the check itself fails --
              // laptop waking from sleep, a dropped connection, a deploy
              // swapping sw.js mid-fetch. Nothing to do about any of
              // those; the next tick simply retries. Left uncaught, each
              // one landed in Sentry as an unhandled rejection
              // (FINALVAULT-7, -B, -C).
              setInterval(() => {
                if (!navigator.onLine) return
                registration.update().catch(() => {})
              }, 60 * 1000)
            })
            .catch(err => {
              console.warn('Service worker registration failed:', err)
            })

          // Once the new worker has actually taken control, reload so
          // the page picks up the fresh JS/CSS -- swapping which
          // worker is active doesn't retroactively update code already
          // loaded into the running page. Guarded against firing twice
          // (controllerchange can theoretically fire more than once in
          // some edge cases), matching the standard recommended pattern.
          //
          // But NOT on a first-ever visit: sw.js claims the page as soon
          // as it installs, which also fires controllerchange even though
          // nothing is stale. Reloading then made every new visitor's
          // page reload a moment after it appeared. Only reload when an
          // existing worker is replaced, i.e. an actual deploy.
          let hadController = Boolean(navigator.serviceWorker.controller)
          let refreshing = false
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) {
              hadController = true
              return
            }
            if (refreshing) return
            refreshing = true
            window.location.reload()
          })
        })
      }
    </script>
  </body>
</html>
